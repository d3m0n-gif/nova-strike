<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NovaStrike</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- LOGIN -->

    <div id="auth-screen">

        <div class="auth-box">

            <h1>NOVASTRIKE</h1>

            <p class="subtitle">
                Multiplayer Arena
            </p>

            <div id="login-form">

                <input
                    id="login-email"
                    type="email"
                    placeholder="Email"
                >

                <input
                    id="login-password"
                    type="password"
                    placeholder="Password"
                >

                <button id="login-button">
                    LOGIN
                </button>

                <p id="login-error"></p>

                <button
                    id="show-register"
                    class="secondary-button"
                >
                    CREATE ACCOUNT
                </button>

            </div>


            <!-- REGISTER -->

            <div
                id="register-form"
                style="display:none;"
            >

                <input
                    id="register-username"
                    type="text"
                    maxlength="20"
                    placeholder="Username"
                >

                <input
                    id="register-email"
                    type="email"
                    placeholder="Email"
                >

                <input
                    id="register-password"
                    type="password"
                    placeholder="Password"
                >

                <button id="register-button">
                    CREATE ACCOUNT
                </button>

                <p id="register-error"></p>

                <button
                    id="show-login"
                    class="secondary-button"
                >
                    BACK TO LOGIN
                </button>

            </div>

        </div>

    </div>


    <!-- GAME -->

    <div id="game-screen"></div>


    <!-- SOCKET.IO -->

    <script src="/socket.io/socket.io.js"></script>


    <!-- GAME -->

    <script
        type="module"
        src="/game.js"
    ></script>


    <script>

        const authScreen =
            document.getElementById(
                "auth-screen"
            );

        const loginForm =
            document.getElementById(
                "login-form"
            );

        const registerForm =
            document.getElementById(
                "register-form"
            );


        // ====================================================
        // REGISTER SCREEN
        // ====================================================

        document
            .getElementById(
                "show-register"
            )
            .addEventListener(
                "click",
                () => {

                    loginForm.style.display =
                        "none";

                    registerForm.style.display =
                        "block";

                }
            );


        // ====================================================
        // LOGIN SCREEN
        // ====================================================

        document
            .getElementById(
                "show-login"
            )
            .addEventListener(
                "click",
                () => {

                    registerForm.style.display =
                        "none";

                    loginForm.style.display =
                        "block";

                }
            );


        // ====================================================
        // START GAME
        // ====================================================

        function startNovaStrike() {

            authScreen.style.display =
                "none";


            document.body.style.overflow =
                "hidden";


            // Give game.js a moment to load

            if (
                typeof window.loadThree ===
                "function"
            ) {

                window.loadThree();

            } else {

                setTimeout(
                    startNovaStrike,
                    100
                );

            }

        }


        // ====================================================
        // LOGIN
        // ====================================================

        document
            .getElementById(
                "login-button"
            )
            .addEventListener(
                "click",
                async () => {

                    const email =
                        document.getElementById(
                            "login-email"
                        ).value;

                    const password =
                        document.getElementById(
                            "login-password"
                        ).value;

                    const error =
                        document.getElementById(
                            "login-error"
                        );


                    error.textContent =
                        "";


                    try {

                        const response =
                            await fetch(
                                "/api/login",
                                {
                                    method:
                                        "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    credentials:
                                        "include",

                                    body:
                                        JSON.stringify({
                                            email,
                                            password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok
                        ) {

                            error.textContent =
                                data.error ||
                                "Login failed.";

                            return;

                        }


                        // Save username

                        if (
                            data.user &&
                            data.user.username
                        ) {

                            localStorage.setItem(
                                "novaUsername",
                                data.user.username
                            );

                        }


                        startNovaStrike();


                    } catch (err) {

                        console.error(
                            err
                        );


                        error.textContent =
                            "Could not connect to server.";

                    }

                }
            );


        // ====================================================
        // REGISTER
        // ====================================================

        document
            .getElementById(
                "register-button"
            )
            .addEventListener(
                "click",
                async () => {

                    const username =
                        document.getElementById(
                            "register-username"
                        ).value;

                    const email =
                        document.getElementById(
                            "register-email"
                        ).value;

                    const password =
                        document.getElementById(
                            "register-password"
                        ).value;

                    const error =
                        document.getElementById(
                            "register-error"
                        );


                    error.textContent =
                        "";


                    try {

                        const response =
                            await fetch(
                                "/api/register",
                                {
                                    method:
                                        "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    credentials:
                                        "include",

                                    body:
                                        JSON.stringify({
                                            username,
                                            email,
                                            password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok
                        ) {

                            error.textContent =
                                data.error ||
                                "Registration failed.";

                            return;

                        }


                        localStorage.setItem(
                            "novaUsername",
                            username
                        );


                        startNovaStrike();


                    } catch (err) {

                        console.error(
                            err
                        );


                        error.textContent =
                            "Could not connect to server.";

                    }

                }
            );

    </script>

</body>
</html>
