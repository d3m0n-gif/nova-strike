<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NovaStrike</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
  ========================== -->

  <div id="auth-screen">

    <div class="auth-box">

      <h1>NOVASTRIKE</h1>

      <p class="subtitle">
        Multiplayer Arena
      </p>

      <div id="login-form">

        <input
          id="login-email"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="login-password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button id="login-button">
          LOGIN
        </button>

        <p id="login-error"></p>

        <button
          id="show-register"
          class="secondary-button"
        >
          CREATE ACCOUNT
        </button>

      </div>


      <!-- REGISTER -->

      <div
        id="register-form"
        style="display:none;"
      >

        <input
          id="register-username"
          type="text"
          maxlength="20"
          placeholder="Username"
        >

        <input
          id="register-email"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="register-password"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
        >

        <button id="register-button">
          CREATE ACCOUNT
        </button>

        <p id="register-error"></p>

        <button
          id="show-login"
          class="secondary-button"
        >
          BACK TO LOGIN
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       GAME
  ========================== -->

  <div id="game-screen">

    <!-- game.js creates the 3D canvas -->

  </div>


  <!-- =========================
       SETTINGS
  ========================== -->

  <div
    id="settings-screen"
    style="display:none;"
  >

    <div class="settings-box">

      <h2>SETTINGS</h2>

      <p>Controls</p>

      <div class="control-row">
        <span>Forward</span>
        <button data-control="forward">W</button>
      </div>

      <div class="control-row">
        <span>Backward</span>
        <button data-control="backward">S</button>
      </div>

      <div class="control-row">
        <span>Move Left</span>
        <button data-control="left">A</button>
      </div>

      <div class="control-row">
        <span>Move Right</span>
        <button data-control="right">D</button>
      </div>

      <div class="control-row">
        <span>Sprint</span>
        <button data-control="sprint">R</button>
      </div>

      <div class="control-row">
        <span>Slide</span>
        <button data-control="slide">SHIFT</button>
      </div>

      <div class="control-row">
        <span>Sneak</span>
        <button data-control="sneak">C</button>
      </div>

      <div class="control-row">
        <span>Jump</span>
        <button data-control="jump">SPACE</button>
      </div>

      <div class="settings-buttons">

        <button id="reset-controls">
          RESET CONTROLS
        </button>

        <button id="close-settings">
          CLOSE
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       SCRIPTS
  ========================== -->

  <script src="/socket.io/socket.io.js"></script>

  <script type="module" src="/game.js"></script>

  <script>

    const authScreen =
      document.getElementById("auth-screen");

    const registerForm =
      document.getElementById("register-form");

    const loginForm =
      document.getElementById("login-form");


    document
      .getElementById("show-register")
      .addEventListener("click", () => {

        loginForm.style.display = "none";
        registerForm.style.display = "block";

      });


    document
      .getElementById("show-login")
      .addEventListener("click", () => {

        registerForm.style.display = "none";
        loginForm.style.display = "block";

      });


    /* LOGIN */

    document
      .getElementById("login-button")
      .addEventListener("click", async () => {

        const email =
          document.getElementById(
            "login-email"
          ).value;

        const password =
          document.getElementById(
            "login-password"
          ).value;

        const error =
          document.getElementById(
            "login-error"
          );

        error.textContent = "";

        try {

          const response =
            await fetch(
              "/api/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                  email,
                  password
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            error.textContent =
              data.error ||
              "Login failed.";
            return;
          }

          authScreen.style.display =
            "none";

          if (
            typeof window.loadThree ===
            "function"
          ) {
            window.loadThree();
          }

        } catch (err) {

          error.textContent =
            "Could not connect to server.";

        }

      });


    /* REGISTER */

    document
      .getElementById("register-button")
      .addEventListener("click", async () => {

        const username =
          document.getElementById(
            "register-username"
          ).value;

        const email =
          document.getElementById(
            "register-email"
          ).value;

        const password =
          document.getElementById(
            "register-password"
          ).value;

        const error =
          document.getElementById(
            "register-error"
          );

        error.textContent = "";

        try {

          const response =
            await fetch(
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                  username,
                  email,
                  password
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            error.textContent =
              data.error ||
              "Registration failed.";
            return;
          }

          authScreen.style.display =
            "none";

          if (
            typeof window.loadThree ===
            "function"
          ) {
            window.loadThree();
          }

        } catch (err) {

          error.textContent =
            "Could not connect to server.";

        }

      });

  </script>

</body>
</html>
